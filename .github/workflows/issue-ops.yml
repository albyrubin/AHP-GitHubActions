# Issue ops
name: issue-ops

# Use the 'issues' trigger with 'labeled' event
on:
  issues:
    types: [labeled]

jobs:
  issue-ops:
    # Run the job only for the specific label 'repo-request'
    if: ${{ github.event.label.name == 'repo-request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    outputs:
      REPO_NAME: ${{ steps.repo-request.outputs.REPO_NAME }}
    steps:
      # Action from marketplace to parse the body of issues created as forms
      - name: Issue Forms Body Parser
        id: parse
        uses: zentered/issue-forms-body-parser@v2.0.0

      - name: Repository Request Validation
        id: repo-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_name=$(echo '${{ steps.parse.outputs.data }}' | jq -r '.name.text')
          repo_dept=$(echo '${{ steps.parse.outputs.data }}' | jq -r '.department.text')
          repo_full_name="$repo_dept-$repo_name"

          echo "REPO_NAME=$repo_full_name" >> "$GITHUB_OUTPUT"

          mention="@${{ github.event.issue.user.login }}: "
          message="Requested repository '$repo_full_name' will be sent for approval."
          exitcode=0

          # shall not be empty
          if [ -z "$repo_full_name" ]; then
              message="Repository name is empty.";
              exitcode=1;
          fi;                  

          # shall be alphanumeric and minus only
          if [[ "$repo_full_name" =~ [^\-a-zA-Z0-9] ]]; then 
              message="Repository name shall be alphanumeric and minus only.";
              exitcode=1;
          fi;
                          
          # shall not start with minus
          if [[ "$repo_full_name" == -* ]]; then
              message="Repository name shall not start with minus.";
              exitcode=1;
          fi;

          # shall not end with minus
          if [[ "$repo_full_name" == *- ]]; then
              message="Repository name shall not end with minus.";
              exitcode=1;
          fi;

          if [ $exitcode -ne 0 ]; then
              gh issue edit "${{ github.event.issue.number }}" --remove-label repo-request --repo "${{ github.event.repository.full_name }}"
              message="$message Please fix the issue and try again by applying the label 'repo-request' again to the issue.";
          fi;

          gh issue comment "${{ github.event.issue.number }}" -b "$mention $message" --repo "${{ github.event.repository.full_name }}"
          exit $exitcode
  create-repo:
    needs: issue-ops
    runs-on: ubuntu-latest
    environment: repo-creation
    permissions:
      issues: write
      contents: read
    env:
      REPO_OWNER: ${{ vars.ORGANIZATION }}
      REPO_NAME: ${{ needs.issue-ops.outputs.REPO_NAME }}
      USER: ${{ github.event.issue.user.login }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Exchange OAuth code for user token (first-time only)
        id: exchange
        env:
          CODE: ${{ secrets.CODE }}
        if: ${{ env.CODE != '' }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -X POST "https://github.com/login/oauth/access_token" \
            -H "Accept: application/json" \
            -d "client_id=${{ vars.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CLIENT_SECRET }}" \
            -d "code=${{ env.CODE }}")
          echo "$RESP" | jq .
          ACCESS=$(echo "$RESP" | jq -r .access_token)
          REFRESH=$(echo "$RESP" | jq -r .refresh_token)

          if [ -z "${ACCESS}" ] || [ "${ACCESS}" = "null" ]; then
            echo "First-time code exchange failed."; exit 1
          fi
          echo "token=${ACCESS}" >> "$GITHUB_OUTPUT"
          if [ -n "${REFRESH}" ] && [ "${REFRESH}" != "null" ]; then
            echo "refresh_token=${REFRESH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh user access token (OAuth)
        id: get-workflow-token
        env:
          CODE: ${{ secrets.CODE }}
        if: ${{ env.CODE == '' }}
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.REFRESH_TOKEN }}" ]; then
            echo "No refresh token present. Provide 'code' once to bootstrap."; exit 1
          fi

          RESP=$(curl -sS -X POST "https://github.com/login/oauth/access_token" \
            -H "Accept: application/json" \
            -d "client_id=${{ vars.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CLIENT_SECRET }}" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=${{ secrets.REFRESH_TOKEN }}")

          ACCESS=$(echo "$RESP" | jq -r .access_token)

          if [ -z "$ACCESS" ] || [ "$ACCESS" = "null" ]; then
            echo "Token refresh failed"; exit 1
          fi
          echo "token=$ACCESS" >> "$GITHUB_OUTPUT"

          NEW_REFRESH=$(echo "$RESP" | jq -r .refresh_token)

          if [ -n "${NEW_REFRESH}" ] && [ "${NEW_REFRESH}" != "null" ]; then
            echo "refresh_token=${NEW_REFRESH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update REFRESH_TOKEN secret (if a new one is present)
        if: ${{ steps.exchange.outputs.refresh_token != '' || steps.get-workflow-token.outputs.refresh_token != '' }}
        env:
          GH_TOKEN: ${{ steps.exchange.outputs.token || steps.get-workflow-token.outputs.token }}
        run: |
          set -euo pipefail
          NEW_RT="${{ steps.exchange.outputs.refresh_token || steps.get-workflow-token.outputs.refresh_token }}"
          printf "%s" "$NEW_RT" | gh secret set REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" --app actions

      # Create the repository and set the URL as an output parameter
      - name: Create repository
        id: create-repo
        if: ${{ steps.exchange.outputs.refresh_token != '' || steps.get-workflow-token.outputs.refresh_token != '' }}
        env:
          GH_TOKEN: ${{ steps.exchange.outputs.token || steps.get-workflow-token.outputs.token }}
        run: |
          REPO_URL=$(gh repo create $REPO_OWNER/$REPO_NAME --private --clone)

          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "Repository '$REPO_NAME' has been successfully created: $REPO_URL"

      # Notify the user if the repository has been successfully created
      - name: Notify User
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ steps.create-repo.outputs.repo_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            -b "@$USER: Repository '$REPO_OWNER/$REPO_NAME' has been created successfully: '$REPO_URL'" --repo ${{ github.event.repository.full_name }}
          gh issue edit "$ISSUE_NUMBER" --remove-label repo-request --repo ${{ github.event.repository.full_name }}

      # Notify the user in case of errors
      - name: Handle Exception
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            -b "@$USER: Repository '$REPO_OWNER/$REPO_NAME' creation failed. Please contact the administrator." \
            --repo ${{ github.event.repository.full_name }}
