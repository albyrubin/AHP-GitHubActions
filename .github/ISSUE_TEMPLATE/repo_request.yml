name: "Repository Request"
description: "Request a new repoistory"
title: "Repository Request"

labels:
  - "repo-request"
  - "issue-ops"

projects: "albyrubin/2"
assignees:
  - albyrubin

body:
  - type: input
    id: name
    attributes:
      label: "Name"
      description: "Name of the repository in lower-case and kebab casing"
      placeholder: "your-repo-name-kebab"
    validations:
      required: true
  - type: dropdown
    id: department
    attributes:
      label: "Department"
      description: "Pick your department. It will be used as a prefix for the repository name"
      multiple: false
      options:
        - it
        - support
      default: 0
    validations:
      required: true
